<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Танчики</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script><meta name="theme-color" content="#101715"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Танчики">

<style>
:root{--bg:#dde4df;--fg:#1d2a26;--mut:#4d5f58;--btn:#f4f7f5;--line:#9fb0a8;--acc:#2f6b4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101715;--fg:#e3ece7;--mut:#93a89f;--btn:#1c2723;--line:#34463f;--acc:#7fd1a5}}
:root[data-theme="dark"]{--bg:#101715;--fg:#e3ece7;--mut:#93a89f;--btn:#1c2723;--line:#34463f;--acc:#7fd1a5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1{margin:0;font-size:1.5rem;letter-spacing:.02em}
#hud{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:30px}
#hud span{background:var(--btn);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}
#hud b{font-variant-numeric:tabular-nums}
#hud .lv{color:#e4573d;letter-spacing:2px}
.ei{width:11px;height:14px;margin-left:1px;vertical-align:-2px}
#hint{margin:0;color:var(--mut);font-size:.85rem;text-align:center}
.bar{display:flex;gap:8px}
#rooms{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;width:min(100%,520px)}
#rooms input{width:120px;min-width:0;padding:7px 9px;border:2px solid var(--line);border-radius:9px;background:var(--btn);color:var(--fg);font:inherit;text-transform:uppercase}
#rooms button{font-size:.9rem;padding:7px 10px}
#room-status{width:100%;min-height:1.2em;color:var(--mut);font-size:.85rem;text-align:center}
#mus,#pz{font-size:.9rem;padding:6px 14px}
canvas{width:min(100%,520px);aspect-ratio:1;background:#111;border:3px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);touch-action:none}
#pad{display:flex;width:min(100%,520px);justify-content:space-between;align-items:center;padding:4px 8px}
#joy{position:relative;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--btn) 0%,transparent 72%);border:2px solid var(--line);touch-action:none;box-shadow:inset 0 0 20px rgba(0,0,0,.25)}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--acc);opacity:.85;box-shadow:0 3px 10px rgba(0,0,0,.4);pointer-events:none;transition:transform .05s}
.dp{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:4px}
.dp button:nth-child(1){grid-area:1/2}.dp button:nth-child(2){grid-area:2/1}.dp button:nth-child(3){grid-area:2/3}.dp button:nth-child(4){grid-area:3/2}
button{font:inherit;font-size:1.3rem;color:var(--fg);background:var(--btn);border:2px solid var(--line);border-radius:10px;touch-action:none;-webkit-tap-highlight-color:transparent}
button:active,button.on{background:var(--acc);color:var(--bg)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#fire{width:104px;height:104px;border-radius:50%;font-size:1.1rem;font-weight:700}
</style>
</head>
<body>
<h1>Танчики</h1>
<div id="hud"></div>
<div id="rooms"><button id="create-room" type="button">Создать комнату</button><input id="room-code" maxlength="6" autocomplete="off" placeholder="Код комнаты" aria-label="Код комнаты"><button id="join-room" type="button">Войти</button><button id="copy-room" type="button">Копировать код</button><div id="room-status" role="status">Одиночная игра</div></div>
<div class="bar"><button id="pz" type="button">⏸ Пауза</button><button id="mus" type="button">♪ Музыка: вкл</button></div>
<canvas id="c" width="416" height="416"></canvas>
<p id="hint">Кликните по игре, затем: стрелки или WASD, пробел — огонь. P — пауза. Бонусы: Щ щит, С огонь, + жизнь, З заморозка, Б бронебойные, У ускорение, ! бомба, А амфибия (по воде). Защитите штаб внизу.</p>
<div id="pad">
<div id="joy" aria-label="Джойстик"><div id="knob"></div></div>
<button id="fire">Огонь</button>
</div>
<script>
const T=32,N=13,S=T*N;let TOTAL=15;
let MAP;function genLevel(L){
  for(let at=0;at<80;at++){
    let s=(L+1)*7919+at*104729;
    const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
    const m=Array.from({length:13},()=>Array(13).fill('.'));
    const put=(x,y,c)=>{if(y<1||y>10||x<0||x>12)return;m[y][x]=c;m[y][12-x]=c};
    const stamp=(c,n,mw)=>{for(let i=0;i<n;i++){const w=1+(rnd()*mw|0),h=1+(rnd()*mw|0),x=rnd()*7|0,y=1+(rnd()*10|0);for(let a=0;a<w;a++)for(let b=0;b<h;b++)put(x+a,y+b,c)}};
    stamp('F',3+(L>>1),3);stamp('M',2+(L>>2),2);stamp('B',12+L,2);stamp('S',1+L,2);if(L>=3)stamp('W',L>>1,2);
    if(L>=1){const ry=3+(rnd()*5|0);for(let x=0;x<13;x++)m[ry][x]='W';for(const b of [1+(rnd()*2|0),4+(rnd()*2|0)]){m[ry][b]='R';m[ry][12-b]='R'}}
    m[0].fill('.');m[11]=".....BBB.....".split('');m[12]=".....BEB.....".split('');
    const seen=new Set(['0,0','6,0','12,0']),q=[[0,0],[6,0],[12,0]];
    while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>12||ny>12)continue;const c=m[ny][nx];if(c==='S'||c==='W')continue;const k=nx+','+ny;if(!seen.has(k)){seen.add(k);q.push([nx,ny])}}}
    if(seen.has('6,11')&&seen.has('4,12')&&seen.has('0,12'))return m.map(r=>r.join(''));
  }
  return Array(11).fill('.............').concat(['.....BBB.....','.....BEB.....']);
}
const LEVELS=Array.from({length:10},(_,i)=>genLevel(i));MAP=LEVELS[0];
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const cv=document.getElementById('c'),g=cv.getContext('2d'),hud=document.getElementById('hud');
let pfrz=0,helpNext=false,frz=0,combo=0,comboT=0,shots=0,hits=0,lost=0,tg=0,nextLife=5000,toast='',toastT=0,ach={},stars=0,bonus=0,deco=[],lvl=0,total=15,best=0,pw=[],banner=0,paused=false,lastHud='',saved=0,grid,hp,tanks,bullets,st='menu',score=0,lives=3,kills=0,spawned=0,timer=0,player,frame=0;
let held=[],touchDir=null,keyFire=false,touchFire=false;
let coopRole='solo',coopReady=false,coopPlayer2=null,coopInput={dir:null,fire:false},coopSocket=null,coopFrame=0;

const ROOM_SERVER='https://tanchiki-server.pinkovskyi2508.workers.dev';
const roomCodeInput=document.getElementById('room-code'),roomStatus=document.getElementById('room-status');
function roomStatusText(s){roomStatus.textContent=s}
function ensureCoopPlayer(){
  if(coopPlayer2&&tanks.includes(coopPlayer2))return;
  coopPlayer2=Object.assign(mk(8*T,12*T,0,false),{pid:'p2',inv:90});
  tanks.push(coopPlayer2);
}
function sendRoom(message){if(coopSocket&&coopSocket.readyState===WebSocket.OPEN)coopSocket.send(JSON.stringify(message))}
function connectRoom(role,code){
  if(coopSocket){coopSocket.onclose=null;coopSocket.close()}
  coopRole=role;coopReady=false;
  const wsUrl=ROOM_SERVER.replace(/^http/,'ws')+'/ws?room='+encodeURIComponent(code)+'&role='+role;
  coopSocket=new WebSocket(wsUrl);
  coopSocket.onopen=()=>roomStatusText(role==='host'?'Комната создана. Ожидаем второго игрока…':'Подключились. Ждём ведущего…');
  coopSocket.onmessage=(event)=>{
    let m;try{m=JSON.parse(event.data)}catch{return}
    if(m.type==='waiting'){roomStatusText(role==='host'?'Код '+code+' — отправьте его другу':'Ожидаем подключения ведущего…')}
    else if(m.type==='ready'){
      coopReady=true;
      if(role==='host'){ensureCoopPlayer();roomStatusText('Друг подключился! Вы — игрок 1, друг — игрок 2.');sendRoomState()}
      else roomStatusText('Вы подключились как игрок 2. Управляйте своим танком!');
    }else if(m.type==='input'&&role==='host'){
      coopInput={dir:Number.isInteger(m.dir)?m.dir:null,fire:!!m.fire};
    }else if(m.type==='state'&&role==='guest'){
      applyRoomState(m.state);
    }else if(m.type==='guest_left'&&role==='host'){
      coopReady=false;coopInput={dir:null,fire:false};
      tanks=tanks.filter(t=>t.pid!=='p2');coopPlayer2=null;
      roomStatusText('Друг вышел. Код комнаты: '+code);
    }else if(m.type==='host_left'&&role==='guest'){
      roomStatusText('Ведущий отключился. Можно вернуться в одиночную игру.');
      coopRole='solo';coopReady=false;coopPlayer2=null;tanks=tanks.filter(t=>t.pid!=='p2');
    }
  };
  coopSocket.onerror=()=>roomStatusText('Не удалось подключиться. Проверьте код и попробуйте ещё раз.');
  coopSocket.onclose=()=>{
    if(coopRole===role){coopRole='solo';coopReady=false;coopPlayer2=null;roomStatusText('Соединение закрыто. Одиночная игра.')}
  };
}
function sendRoomState(){
  if(coopRole!=='host'||!coopReady)return;
  sendRoom({type:'state',state:{grid:grid.map(r=>r.join('')),hp,tanks:tanks.map(t=>({...t})),player:{...player},bullets,pw,lvl,TOTAL,score,lives,kills,spawned,timer,st,paused,combo,comboT,frz,pfrz,banner,toast,toastT,bonus,stars,lost,shots,hits}});
}
function applyRoomState(s){
  if(!s)return;
  if(s.grid)grid=s.grid.map(r=>r.split(''));hp=s.hp||hp;tanks=s.tanks||tanks;bullets=s.bullets||[];pw=s.pw||[];
  player=tanks.find(t=>t.pid==='p1')||s.player||tanks.find(t=>!t.e);coopPlayer2=tanks.find(t=>t.pid==='p2')||null;
  if(s.lvl!==lvl)deco=[];
  lvl=s.lvl;TOTAL=s.TOTAL;score=s.score;lives=s.lives;kills=s.kills;spawned=s.spawned;timer=s.timer;st=s.st;paused=s.paused;combo=s.combo;comboT=s.comboT;frz=s.frz;pfrz=s.pfrz;banner=s.banner;toast=s.toast;toastT=s.toastT;bonus=s.bonus;stars=s.stars;lost=s.lost;shots=s.shots;hits=s.hits;
  MAP=LEVELS[lvl%LEVELS.length];
}
document.getElementById('create-room').addEventListener('click',async()=>{
  try{
    roomStatusText('Создаём комнату…');
    const response=await fetch(ROOM_SERVER+'/api/create',{method:'POST'});
    if(!response.ok)throw new Error('server');
    const data=await response.json();roomCodeInput.value=data.code;
    connectRoom('host',data.code);
  }catch{roomStatusText('Не удалось создать комнату. Сервер ещё нужно настроить.')}
});
document.getElementById('join-room').addEventListener('click',()=>{
  const code=roomCodeInput.value.trim().toUpperCase();
  if(!/^[A-HJ-NP-Z2-9]{6}$/.test(code)){roomStatusText('Введите шестизначный код комнаты.');return}
  connectRoom('guest',code);
});
document.getElementById('copy-room').addEventListener('click',async()=>{
  const code=roomCodeInput.value.trim();if(!code){roomStatusText('Сначала создайте комнату или введите её код.');return}
  try{await navigator.clipboard.writeText(code);roomStatusText('Код '+code+' скопирован. Отправьте его другу.')}catch{roomCodeInput.focus();roomCodeInput.select();roomStatusText('Код выделен — скопируйте его и отправьте другу.')}
});
setInterval(()=>{if(coopRole==='guest')sendRoom({type:'input',dir:dir(),fire:keyFire||touchFire})},70);

function mk(x,y,d,e){return{x,y,d,e,sp:e?1:2,cool:0,alive:true,inv:0,pid:e?undefined:'p1'}}
function reset(next){if(next)lvl++;else{lvl=0;score=0;lives=3;tg=0;nextLife=5000}combo=0;comboT=0;shots=0;hits=0;lost=0;frz=0;pfrz=0;helpNext=false;MAP=LEVELS[lvl%LEVELS.length];TOTAL=Math.round(10+2.2*lvl);pw=[];banner=150;paused=false;
  grid=MAP.map(r=>r.split(''));hp=MAP.map(r=>r.split('').map(c=>c==='B'?3:0));bullets=[];scorch.length=0;fx.length=0;kills=0;spawned=0;timer=60;
  player=mk(4*T,12*T,0,false);player.inv=90;player.pid='p1';tanks=[player];coopPlayer2=null;if(coopRole==='host'&&coopReady)ensureCoopPlayer();st='play';
  deco=[];for(let i=0;i<130;i++){const x=Math.random()*S,y=Math.random()*S;if(grid[Math.floor(y/T)][Math.floor(x/T)]==='.')deco.push([x,y,1+Math.random()*2.5,THEMES[lvl%5].d[Math.random()*3|0]])}
}
function hit(x,y,me){
  const a=x+2,b=y+2,e=28;
  for(const [px,py] of [[a,b],[a+e-1,b],[a,b+e-1],[a+e-1,b+e-1]]){
    const tx=Math.floor(px/T),ty=Math.floor(py/T);
    if(tx<0||ty<0||tx>=N||ty>=N||!('.FMR'+(me&&me.am>0?'W':'')).includes(grid[ty][tx]))return true;
  }
  for(const t of tanks)if(t!==me&&t.alive&&Math.abs(t.x-x)<30&&Math.abs(t.y-y)<30)return true;
  return false;
}
function move(t,d){
  const mr=grid[Math.floor((t.y+16)/T)];if(mr&&mr[Math.floor((t.x+16)/T)]==='M'&&frame%2)return true;
  const nx=t.x+DX[d]*t.sp,ny=t.y+DY[d]*t.sp;
  if(!hit(nx,ny,t)){t.x=nx;t.y=ny;return true}
  if(d%2===0){
    const o=Math.round(t.x/T)*T-t.x;
    if(o&&Math.abs(o)<=12){const sx=t.x+Math.sign(o)*Math.min(t.sp,Math.abs(o));if(!hit(sx,t.y,t))t.x=sx}
  }else{
    const o=Math.round(t.y/T)*T-t.y;
    if(o&&Math.abs(o)<=12){const sy=t.y+Math.sign(o)*Math.min(t.sp,Math.abs(o));if(!hit(t.x,sy,t))t.y=sy}
  }
  return false;
}
function pick(){let r=Math.random()*14,i=0;for(const w of [2,2,1,2,2,2,1,2]){if((r-=w)<0)return i;i++}return 0}
function drop(x,y,k){pw.push({x:x+16,y:y+16,k:k===undefined?pick():k,l:720})}
function applyPw(k){
  const N0=['Щит','Скорострельность','+1 жизнь','Заморозка врагов','Бронебойные снаряды','Ускорение','Бомба!','Амфибия'];
  if(k===0)player.sh=600;else if(k===1)player.rf=600;else if(k===2)lives=Math.min(lives+1,5);
  else if(k===3)frz=300;else if(k===4)player.ap=600;else if(k===5)player.bs=600;else if(k===7)player.am=720;
  else{for(const t of tanks)if(t.e&&t.alive){hits++;if(t.ar>1){t.ar--;t.fl=8;ping(t.x+16,t.y+16)}else{t.alive=false;kills++;onKill(t);explode(t.x+16,t.y+16,false)}}}
  pop(player.x+16,player.y-2,N0[k],'#9ef0c0',13);
}
function rewards(t){
  if(helpNext){helpNext=false;drop(t.x,t.y,Math.random()<.5?0:3);toastShow('Подмога: держись!');return}
  if(kills%5===0){player.rf=Math.max(player.rf||0,360);pop(player.x+16,player.y-2,'Серия! Скорострельность','#ffd54f',13)}
  if(combo>=3||kills%4===0||Math.random()<(t.k===0?.7:.4))drop(t.x,t.y);
}
const THEMES=[{a:'#2c4a30',b:'#0f1c13',d:['rgba(150,210,100,.2)','rgba(70,55,40,.18)','rgba(250,230,120,.25)']},
{a:'#6a5530',b:'#2a2112',d:['rgba(235,205,135,.2)','rgba(120,85,50,.2)','rgba(255,245,210,.14)']},
{a:'#3b5a6c',b:'#14212a',d:['rgba(225,242,255,.22)','rgba(140,185,205,.2)','rgba(255,255,255,.16)']},
{a:'#2e3358',b:'#0b0d1c',d:['rgba(150,160,255,.2)','rgba(60,60,110,.22)','rgba(255,255,255,.12)']},
{a:'#5b362a',b:'#1d0f0b',d:['rgba(255,150,90,.2)','rgba(40,20,15,.25)','rgba(255,210,150,.14)']}];
const TS=[1,1,2,2,2,2,2,3,3,3];
const ICT='<svg class="ei" viewBox="-14 -20 28 36"><rect x="-14" y="-14" width="5" height="28" fill="#222"/><rect x="9" y="-14" width="5" height="28" fill="#222"/><rect x="-10" y="-13" width="20" height="26" fill="#7d8286"/><rect x="-7" y="-8" width="14" height="14" fill="#a3a8ac"/><rect x="-2" y="-20" width="4" height="14" fill="#555"/></svg>';
const ICP='<svg class="ei" viewBox="-14 -20 28 36"><rect x="-14" y="-14" width="5" height="28" fill="#222"/><rect x="9" y="-14" width="5" height="28" fill="#222"/><rect x="-9" y="-13" width="18" height="26" fill="#a08c4d"/><rect x="-6" y="-9" width="12" height="13" fill="#c4ae66"/><rect x="-2" y="-20" width="4" height="12" fill="#555"/></svg>';
const PWN=['Щит','Скорострельность','Броня +1','Оглушение!','Бронебойные','Ускорение','Бомба!','Амфибия'];
function enemyGrab(t){
  for(const p of pw){
    if(p.l<=0||Math.abs(p.x-(t.x+16))>=18||Math.abs(p.y-(t.y+16))>=18)continue;
    p.l=0;const k=p.k;
    if(k===0)t.sh=420;else if(k===1)t.rf=480;else if(k===2)t.ar=Math.min((t.ar||1)+1,3);
    else if(k===3){if(!(player.sh>0))pfrz=120}else if(k===4)t.ap=480;else if(k===5)t.bs=480;else if(k===7)t.am=600;
    else{const tx=Math.floor((t.x+16)/T),ty=Math.floor((t.y+16)/T);
      for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const row=grid[ty+b];if(row&&row[tx+a]==='B')row[tx+a]='.'}
      if(!(player.sh>0)&&Math.hypot(player.x-t.x,player.y-t.y)<70)pfrz=90;
      explode(t.x+16,t.y+16,true)}
    pop(t.x+16,t.y-2,'Враг: '+PWN[k],'#ff8a80',12);
  }
}
function dirOK(t,d){return !hit(t.x+DX[d]*3,t.y+DY[d]*3,t)}
function ai(t){
  const cx=t.x+16,cy=t.y+16;
  if(t.hold>0){t.hold--;return}
  for(const b of bullets){
    if(b.e)continue;
    const v=b.d%2===0;
    const near=v?Math.abs(b.x-cx)<18&&((b.d===0&&b.y>cy&&b.y-cy<130)||(b.d===2&&b.y<cy&&cy-b.y<130)):Math.abs(b.y-cy)<18&&((b.d===1&&b.x<cx&&cx-b.x<130)||(b.d===3&&b.x>cx&&b.x-cx<130));
    if(near){const o=v?[1,3]:[0,2];if(Math.random()<.5)o.reverse();for(const d of o)if(dirOK(t,d)){t.d=d;t.hold=16;return}}
  }
  if(--t.think>0&&!t.blocked)return;
  t.think=18+Math.random()*28|0;t.blocked=false;
  const hunt=t.k===1&&Math.random()<.6;
  const pk=pw.find(p=>Math.hypot(p.x-cx,p.y-cy)<160),tx=pk?pk.x:hunt?player.x+16:6*T+16,ty=pk?pk.y:hunt?player.y+16:12*T+16,dx=tx-cx,dy=ty-cy;
  const a=dx>0?1:3,b2=dy>0?2:0;
  let list=Math.abs(dx)>Math.abs(dy)?[a,b2]:[b2,a];
  const rest=[0,1,2,3].filter(d=>!list.includes(d)).sort(()=>Math.random()-.5);
  list=Math.random()<.18?[0,1,2,3].sort(()=>Math.random()-.5):list.concat(rest);
  for(const d of list)if(dirOK(t,d)){t.d=d;return}
}
function aim(t){
  const cx=t.x+16,cy=t.y+16,d=t.d;
  const inl=(x,y,w)=>d===0?y<cy&&Math.abs(x-cx)<w:d===2?y>cy&&Math.abs(x-cx)<w:d===1?x>cx&&Math.abs(y-cy)<w:x<cx&&Math.abs(y-cy)<w;
  let p=.012+lvl*.004;
  if(inl(player.x+16,player.y+16,20))p=.3;
  else if(inl(6*T+16,12*T+16,18))p=.22;
  else if(t.blocked)p=.12;
  if(Math.random()<p)fire(t);
}
function pop(x,y,s,c,r){fx.push({t:'text',x,y,vx:0,vy:-.7,l:50,m:50,r:r||14,f:.98,c:c||'#ffe08a',s})}
function toastShow(s){toast=s;toastT=200}
function unlock(id,title){if(ach[id])return;ach[id]=1;try{localStorage.setItem('ta',JSON.stringify(ach))}catch(e){}toastShow('🏅 '+title)}
function onKill(t){
  combo=comboT>0?Math.min(combo+1,5):1;comboT=180;
  const pts=(t.k===0?200:100)*combo;score+=pts;
  pop(t.x+16,t.y+8,'+'+pts+(combo>1?' ×'+combo:''),combo>1?'#7dffb0':'#ffe08a',combo>1?17:14);
  if(t.k===0){tg++;if(tg>=3)unlock('tiger','Охотник на Тигров')}
  if(kills===1)unlock('first','Первая кровь');
  if(combo>=3)unlock('combo','Мастер комбо');
}
function finish(){
  const acc=shots?hits/shots:0;
  bonus=(lost===0?500:0)+Math.round(acc*300);score+=bonus;
  stars=lost===0&&acc>=.5?3:lost<=1?2:1;
  if(lost===0)unlock('flawless','Без потерь');
}
function go(){if(coopRole==='guest')return;if(st==='win')reset(lvl<9);else if(st!=='play')reset()}
function fire(t){
  if(t.cool>0)return;
  if(!t.e)shots++;
  t.cool=t.e?(t.rf>0?15:Math.max(30,70-lvl*6)):(t.rf>0?9:22);
  bullets.push({x:t.x+16+DX[t.d]*16,y:t.y+16+DY[t.d]*16,d:t.d,e:t.e,ap:t.ap>0});
  boom(t.x+16+DX[t.d]*16,t.y+16+DY[t.d]*16,4,['#ffe9a0','#ffb347'],1.6,2);
}
function dir(){return held.length?held[held.length-1]:touchDir}

function update(){
  const d=pfrz>0?null:dir();
  player.sp=player.bs>0?3:2;if(d!==null){player.d=d;move(player,d)}
  if(coopRole==='host'&&coopReady&&coopPlayer2&&coopPlayer2.alive){
    coopPlayer2.sp=coopPlayer2.bs>0?3:2;
    if(coopInput.dir!==null){coopPlayer2.d=coopInput.dir;move(coopPlayer2,coopInput.dir)}
    if(coopInput.fire&&!(pfrz>0))fire(coopPlayer2);
  }
  for(const p of pw)if(Math.abs(p.x-(player.x+16))<20&&Math.abs(p.y-(player.y+16))<20){p.l=0;applyPw(p.k);score+=50;boom(p.x,p.y,10,['#fff','#9ef0c0'],2,2);sfxPing()}
  pw=pw.filter(p=>--p.l>0);
  if(score>=nextLife){nextLife+=5000;lives=Math.min(lives+1,5);toastShow('Бонус: +1 жизнь за очки!')}
  if(score>=5000)unlock('rich','Пять тысяч очков');
  if((keyFire||touchFire)&&!(pfrz>0))fire(player);
  for(const t of tanks){
    if(t.cool>0)t.cool--;
    if(t.inv>0)t.inv--;if(t.fl>0)t.fl--;if(t.sh>0)t.sh--;if(t.rf>0)t.rf--;if(t.ap>0)t.ap--;if(t.bs>0)t.bs--;if(t.am>0)t.am--;if(t.e)t.sp=(t.bs>0||(t.k===1&&lvl>=6))?2:1;
    if(t.e&&t.k===0&&t.ar===1&&frame%7===0)fx.push({t:'smoke',x:t.x+16,y:t.y+16,vx:(Math.random()-.5)*.4,vy:-.3,l:40,m:40,r:3,gr:.15,f:.97,c:'#333'});
    if(t.e){
      enemyGrab(t);if(!(frz>0)){ai(t);if(!move(t,t.d))t.blocked=true;aim(t)}
    }
  }
  for(const b of bullets){
    b.x+=DX[b.d]*5;b.y+=DY[b.d]*5;
    const tx=Math.floor(b.x/T),ty=Math.floor(b.y/T);
    if(tx<0||ty<0||tx>=N||ty>=N)b.dead=true;
    else{
      const c=grid[ty][tx];
      if(c==='B'){if(--hp[ty][tx]<=0||b.ap)grid[ty][tx]='.';b.dead=true;boom(b.x,b.y,6,['#c0603a','#8a4022','#3a1a0e'],2.2,2.2)}
      else if(c==='S'){b.dead=true;if(b.ap)grid[ty][tx]='.';boom(b.x,b.y,5,['#e8edf0','#ffd27a'],2.6,1.4)}
      else if(c==='E'){grid[ty][tx]='D';b.dead=true;st='over';explode(tx*T+16,ty*T+16,true)}
    }
    if(b.dead)continue;
    for(const t of tanks){
      if(!t.alive||t.e===b.e||Math.abs(t.x+16-b.x)>=14||Math.abs(t.y+16-b.y)>=14)continue;
      b.dead=true;
      if(t.e){
        hits++;if(t.sh>0){ping(b.x,b.y)}else if(t.ar>1&&!b.ap){t.ar--;t.fl=8;ping(b.x,b.y);score+=25}
        else{t.alive=false;kills++;onKill(t);explode(t.x+16,t.y+16,false);rewards(t)}
      }
      else if(!t.inv&&!t.sh){
        lives--;lost++;combo=0;comboT=0;helpNext=true;explode(t.x+16,t.y+16,true);
        if(lives<=0){t.alive=false;st='over'}
        else{t.x=4*T;t.y=12*T;t.d=0;t.inv=90}
      }
      break;
    }
  }
  bullets=bullets.filter(b=>!b.dead);
  tanks=tanks.filter(t=>t.alive);
  const foes=tanks.filter(t=>t.e).length;
  if(--timer<=0&&spawned<TOTAL&&foes<Math.min(7,3+Math.ceil((lvl+1)/2))){
    const sx=[0,6,12][spawned%3]*T;
    if(!hit(sx,0,null)){const kk=spawned%3<TS[Math.min(lvl,9)]?0:1;tanks.push(Object.assign(mk(sx,0,2,true),{k:kk,ar:kk===0?2:1}));spawned++;timer=Math.max(70,150-lvl*8)}else timer=30;
  }
  if(st==='play'&&spawned>=TOTAL&&foes===0){st='win';finish()}
}

      g.fillStyle='#4a361b';g.fillRect(px+3,py,2,T);g.fillRect(px+T-5,py,2,T);

      g.fillStyle='rgba(105,72,38,.7)';g.beginPath();g.ellipse(px+16,py+16,15,12,0,0,7);g.fill();
      g.fillStyle='rgba(60,38,18,.55)';
      for(const [a,b,r] of [[10,14,3],[21,19,4],[17,10,2.5]]){g.beginPath();g.arc(px+a,py+b,r,0,7);g.fill()}
    }else if(c==='D'){
      g.fillStyle='#4a4a3a';g.fillRect(px+4,py+18,24,8);g.fillRect(px+10,py+12,8,8);
    }
  }
  for(const p of pw){if(p.l<180&&frame%12<6)continue;const c=['#4fc3f7','#ffd54f','#ef5350','#80deea','#ff8a65','#aed581','#ba68c8','#26a69a'][p.k];g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.arc(p.x+1,p.y+2,11,0,7);g.fill();g.fillStyle=c;g.beginPath();g.arc(p.x,p.y,10,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();g.fillStyle='#fff';g.font='bold 13px "Trebuchet MS",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(['Щ','С','+','З','Б','У','!','А'][p.k],p.x,p.y+1);g.textBaseline='alphabetic'}
  for(const t of tanks)drawTank(t);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x]==='F'){
    const px=x*T,py=y*T,s=(x*7+y*13)%5;
    g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(px+17,py+23,14,9,0,0,7);g.fill();
    g.globalAlpha=.93;
    for(const [a,b,r,c] of [[10,11,9,'#1f6b34'],[22,12,9,'#27803d'],[16,21,10,'#2e9246'],[10,22,7,'#1f6b34'],[23,23,7,'#27803d']]){g.fillStyle=c;g.beginPath();g.arc(px+a+Math.sin(frame/24+x*1.3+y*.7+a*.3)*1.4,py+b+Math.cos(frame/31+y+a*.2)*.9,r,0,7);g.fill()}
    g.globalAlpha=1;g.fillStyle='rgba(190,255,170,.28)';
    for(const [a,b,r] of [[12,8,4],[24,10,3.5],[17,18,4]]){g.globalAlpha=.55+.45*Math.sin(frame/17+x*2+y+a);g.beginPath();g.arc(px+a+Math.sin(frame/24+x*1.3+y*.7+a*.3)*1.4,py+b,r,0,7);g.fill()}g.globalAlpha=1;
  }
  for(const b of bullets){g.strokeStyle='rgba(255,220,140,.45)';g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-DX[b.d]*10,b.y-DY[b.d]*10);g.stroke();g.fillStyle='rgba(255,210,110,.3)';g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(b.x,b.y,2.2,0,7);g.fill()}
  for(const p of fx){
    const a=p.l/p.m;g.globalAlpha=p.t==='smoke'?a*.55:a;
    g.globalCompositeOperation=p.add?'lighter':'source-over';
    if(p.t==='ring'){g.strokeStyle=p.c;g.lineWidth=2.5*a+.5;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.stroke()}
    else if(p.t==='streak'){g.strokeStyle=p.c;g.lineWidth=1.4;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*2.5,p.y-p.vy*2.5);g.stroke()}
    else if(p.t==='text'){g.fillStyle=p.c;g.font='bold '+p.r+'px "Trebuchet MS",sans-serif';g.textAlign='center';g.fillText(p.s,p.x,p.y)}
    else if(p.t==='chunk'){g.fillStyle=p.c;g.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r)}
    else{g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,Math.max(p.r,.1)*(p.t==='smoke'||p.gr?1:.4+.6*a),0,7);g.fill()}
  }
  g.globalCompositeOperation='source-over';
  g.globalAlpha=1;
  const vg=g.createRadialGradient(S/2,S/2,S*.35,S/2,S/2,S*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.4)');
  g.fillStyle=vg;g.fillRect(0,0,S,S);
  if(banner>0&&st==='play'){g.globalAlpha=Math.min(1,banner/40);g.fillStyle='#fff';g.textAlign='center';g.font='bold 38px "Trebuchet MS",sans-serif';g.fillText('Уровень '+(lvl+1)+' из 10',S/2,S/2);g.font='15px "Trebuchet MS",sans-serif';g.fillText('Врагов: '+TOTAL,S/2,S/2+26);g.globalAlpha=1}
  if(paused){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,S,S);g.fillStyle='#fff';g.textAlign='center';g.font='bold 34px "Trebuchet MS",sans-serif';g.fillText('Пауза',S/2,S/2)}
  if(st!=='play'){
    g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,0,S,S);
    g.fillStyle='#fff';g.textAlign='center';
    g.font='bold 34px "Trebuchet MS",sans-serif';
    g.fillText(st==='menu'?'ТАНЧИКИ':st==='win'?(lvl>=9?'Победа! 10 уровней!':'Уровень пройден!'):'Игра окончена',S/2,S/2-12);
    g.font='16px "Trebuchet MS",sans-serif';
    if(st==='win'){g.font='bold 34px "Trebuchet MS",sans-serif';g.fillStyle='#ffd54f';g.fillText('★'.repeat(stars)+'☆'.repeat(3-stars),S/2,S/2+30);g.fillStyle='#fff';g.font='16px "Trebuchet MS",sans-serif';g.fillText('Бонус: +'+bonus+(lost===0?' (без потерь)':''),S/2,S/2+52)}
    if(st!=='menu')g.fillText('Очки: '+score,S/2,S/2+(st==='win'?76:16));
    g.fillText('Пробел или касание: '+(st==='win'?(lvl>=9?'заново':'дальше'):st==='menu'?'старт':'ещё раз'),S/2,S/2+(st==='win'?100:44));
  }
  if(toastT>0){g.globalAlpha=Math.min(1,toastT/30);g.fillStyle='rgba(15,25,20,.88)';g.fillRect(S/2-150,8,300,30);g.strokeStyle='#e6c34a';g.lineWidth=1.5;g.strokeRect(S/2-150,8,300,30);g.fillStyle='#ffe08a';g.textAlign='center';g.font='bold 14px "Trebuchet MS",sans-serif';g.fillText(toast,S/2,28);g.globalAlpha=1}
  if(score>best)best=score;
  let ic='';for(let j=kills;j<TOTAL&&j-kills<30;j++)ic+=j%3<TS[Math.min(lvl,9)]?ICT:ICP;
  const hs='<span>Уровень <b>'+(lvl+1)+'</b></span><span>Очки <b>'+score+'</b></span><span>Рекорд <b>'+best+'</b></span><span class="lv">'+'♥'.repeat(Math.max(lives,0))+'</span><span>Врагов <b>'+(TOTAL-kills)+'</b> '+ic+'</span>'+(comboT>0&&combo>1?'<span>Комбо <b>×'+combo+'</b></span>':'')+(player.sh>0?'<span>Щит</span>':'')+(player.rf>0?'<span>Скорострельность</span>':'')+(player.ap>0?'<span>Бронебойные</span>':'')+(player.bs>0?'<span>Ускорение</span>':'')+(frz>0?'<span>Заморозка</span>':'')+(player.am>0?'<span>Амфибия</span>':'')+(pfrz>0?'<span>Оглушён!</span>':'');
  if(hs!==lastHud){hud.innerHTML=hs;lastHud=hs}
  const pt=paused?'▶ Продолжить':'⏸ Пауза';if(pzb.textContent!==pt)pzb.textContent=pt;
  if(st!=='play'){if(!saved){saved=1;try{localStorage.setItem('tb',best)}catch(e){}}}else saved=0;
}

/* Музыка: оригинальный рок-трек в духе русского рока (Ля минор, ход Am-G-F-E), 8-битный звук */
let ac,mg,nb,musicOn=true,seq=0,nextT=0,mtimer=null;
const BASS=[45,43,41,40];
const LEAD=[[76,0,72,0,69,72,76,0],[74,0,71,0,67,71,74,0],[72,0,69,0,65,69,72,69],[71,0,68,71,0,0,76,0],
[76,0,79,0,81,0,79,76],[79,0,74,0,71,74,79,0],[77,0,72,0,69,72,77,72],[76,0,71,0,68,71,76,0]];
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(type,f,t,d,v){const o=ac.createOscillator(),q=ac.createGain();o.type=type;o.frequency.value=f;q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(q).connect(mg);o.start(t);o.stop(t+d+.02)}
function noise(t,d,v,f,type){const s=ac.createBufferSource(),q=ac.createGain(),fl=ac.createBiquadFilter();s.buffer=nb;fl.type=type;fl.frequency.value=f;q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(q).connect(mg);s.start(t);s.stop(t+d)}
function kick(t){const o=ac.createOscillator(),q=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);q.gain.setValueAtTime(.9,t);q.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(q).connect(mg);o.start(t);o.stop(t+.2)}
function step(s,t){
  const bar=s>>3,i=s&7;
  tone('triangle',hz(BASS[bar%4]+(i%4===3?12:0)),t,.2,.5);
  const n=LEAD[bar][i];if(n)tone('square',hz(n),t,.22,.13);
  if(i===0||i===4)kick(t);
  if(i===2||i===6)noise(t,.12,.3,1800,'bandpass');else noise(t,.04,.07,7000,'highpass');
}
function sched(){while(nextT<ac.currentTime+.2){step(seq,nextT);nextT+=.227;seq=(seq+1)%64}}
function startMusic(){
  if(!ac){
    ac=new(window.AudioContext||window.webkitAudioContext)();
    mg=ac.createGain();mg.gain.value=.3;mg.connect(ac.destination);
    nb=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);
    const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  ac.resume();
  if(!mtimer){nextT=ac.currentTime+.1;mtimer=setInterval(sched,50)}
}
const mus=document.getElementById('mus');
mus.addEventListener('click',()=>{
  musicOn=!musicOn;
  if(musicOn){startMusic();mg.gain.value=.3}else if(mg)mg.gain.value=0;
  mus.textContent='♪ Музыка: '+(musicOn?'вкл':'выкл');
});
const first=()=>{if(musicOn)startMusic()};
addEventListener('pointerdown',first,{once:true});addEventListener('keydown',first,{once:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')paused=true;if(ac){if(document.hidden)ac.suspend();else if(musicOn)ac.resume()}});

try{best=+localStorage.getItem('tb')||0}catch(e){}
try{ach=JSON.parse(localStorage.getItem('ta')||'{}')}catch(e){}
const pzb=document.getElementById('pz');
pzb.addEventListener('click',()=>{if(coopRole==='guest')return;if(st==='play')paused=!paused});
reset();
let last=0,acc=0;
function loop(ts){
  acc+=Math.min(ts-last,100);last=ts;
  while(acc>=16.67){acc-=16.67;if(st==='play'&&!paused&&coopRole!=='guest')update();if(!paused){fxStep();if(banner>0)banner--;if(comboT>0)comboT--;if(frz>0)frz--;if(pfrz>0)pfrz--;if(toastT>0)toastT--}frame++;if(coopRole==='host'&&coopReady&&frame%6===0)sendRoomState()}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const KEYS={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener('keydown',e=>{
  if(e.code in KEYS){e.preventDefault();const d=KEYS[e.code];if(!held.includes(d))held.push(d)}
  else if(e.code==='KeyP'||e.code==='Escape'){if(st==='play')paused=!paused}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(st!=='play')go();else keyFire=true}
});
addEventListener('keyup',e=>{
  if(e.code in KEYS){const d=KEYS[e.code];held=held.filter(x=>x!==d)}
  else if(e.code==='Space')keyFire=false;
});
cv.addEventListener('pointerdown',()=>{window.focus();go()});
document.querySelectorAll('[data-d]').forEach(b=>{
  const d=+b.dataset.d;
  b.addEventListener('pointerdown',e=>{e.preventDefault();touchDir=d;b.classList.add('on')});
  for(const ev of['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{if(touchDir===d)touchDir=null;b.classList.remove('on')});
});
const joy=document.getElementById('joy'),knob=document.getElementById('knob');
let jid=null;
function joyMove(e){
  const r=joy.getBoundingClientRect(),m=r.width/2;
  let dx=e.clientX-(r.left+m),dy=e.clientY-(r.top+r.height/2);
  const l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  const ax=Math.abs(dx),ay=Math.abs(dy),horiz=touchDir===1||touchDir===3,useX=horiz?ax*1.3>=ay:ax>ay*1.3;
  touchDir=Math.hypot(dx,dy)<m*.28?null:(useX?(dx>0?1:3):(dy>0?2:0));
}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;touchDir=null;knob.style.transform='translate(0,0)'}};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
const fb=document.getElementById('fire');
fb.addEventListener('pointerdown',e=>{e.preventDefault();if(st!=='play')go();else touchFire=true;fb.classList.add('on')});
for(const ev of['pointerup','pointercancel','pointerleave'])fb.addEventListener(ev,()=>{touchFire=false;fb.classList.remove('on')});
try{if(window.Telegram&&Telegram.WebApp){const w=Telegram.WebApp;w.ready();w.expand();try{w.disableVerticalSwipes()}catch(e){}}}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
